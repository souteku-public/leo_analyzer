# Kymeta アンテナ テレメトリ収集の設定例
#
# 【設定ファイルなしでも動きます】
# --collect kymeta を設定ファイルなしで実行すると、以下のデフォルトで
# 接続し、よくある API パスを自動探索して JSON を返すものを毎秒記録します。
#   base_url: https://192.168.44.2 / admin / 2Cfg^Ant (工場出荷デフォルト)
#
# 自動探索で見つからない場合や、記録するエンドポイントを固定したい場合に
# このファイルをコピーして config/kymeta.yaml を作成してください。
# 実機のブラウザで WebGUI を開き、開発者ツール (F12) の「ネットワーク」
# タブで GUI が定期的に叩いている JSON エンドポイントを確認できます。
# `python -m leo_analyzer --kymeta-probe` で探索結果と設定スニペットを
# 表示することもできます。

base_url: "https://192.168.44.2"   # アンテナの管理IP
verify_ssl: false                   # 自己署名証明書のため通常 false
timeout: 5.0

auth:
  # --- HTTP Basic 認証の場合 ---
  type: basic
  username: "admin"
  password: "2Cfg^Ant"

  # --- フォーム/トークンログインの場合(上の type: basic を消して使う) ---
  # type: form
  # login_path: "/api/login"
  # payload: { username: "admin", password: "2Cfg^Ant" }
  # token_field: "token"            # ログイン応答JSON内のトークンのキー(ネストは a.b.c)
  # token_header: "Authorization"   # トークンを載せるヘッダ名
  # token_prefix: "Bearer "
  # ※ Cookie セッションのみの場合は token_field を省略(Cookieは自動保持)

# スペクトラム等の大きな配列データの取得間隔(秒)。
# 実機のWebGUIに「スペクトラム表示中は性能が低下する可能性がある」との
# 警告があるため既定は5秒。1 にすると毎秒、大きくすると負荷減
array_interval: 5.0

# 1秒ごとに取得する JSON エンドポイント。空にすると起動時に自動探索する。
# 複数指定可(1行のCSVにマージ、列名は "<name>.<jsonキー>" になる)
# 応答に大きな数値配列(スペクトラム・プロット履歴など)を含むものは
# 自動判定され、全データは kymeta_<name>.jsonl へ、CSVには毎秒の
# 要約(points/min/max/avg)だけが入る
# 実機(ACU 2.6.6.62)のWebGUIが使っているエンドポイント名:
#   status / modem / terminal / tracking-metrics(SINR) /
#   point?select=RX(ビーム指向) / adc-data(スペクトラム)
# URLの前置き(/ か /api/ 等)はファームによるため自動探索が判別します。
# 明示指定する場合の例:
endpoints: []
#  - name: status
#    path: "/status"
#  - name: tracking_metrics
#    path: "/tracking-metrics"
#  - name: spectrum
#    path: "/adc-data"

# WebSocket ストリーム(plots/spectrum ページがリアルタイム配信の場合)。
# 空にすると WebGUI アプリから抽出したパスを自動試行する。
# 受信メッセージは kymeta_ws_<name>.jsonl に全件記録される
stream_endpoints: []
#  - "/ws/spectrum"
#  - "wss://192.168.44.2/stream/plots"
