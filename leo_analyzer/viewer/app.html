<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>LEO データビューア</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  color-scheme: light dark;
  --surface:#fcfcfb; --page:#f9f9f7; --ink:#0b0b0b; --ink-2:#52514e;
  --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --crit:#d03b3b;
}
@media (prefers-color-scheme:dark){:root{
  --surface:#1a1a19; --page:#0d0d0d; --ink:#fff; --ink-2:#c3c2b7;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
h1{font-size:16px;margin:0 12px 0 0}
button,select,input{font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--border);border-radius:6px;padding:5px 10px}
button{cursor:pointer}
button.primary{background:var(--s1);color:#fff;border-color:transparent}
button:disabled{opacity:.45;cursor:default}
main{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px}
@media (max-width:980px){main{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:12px;min-width:0}
.card h2{font-size:13px;margin:0 0 8px;color:var(--ink-2);font-weight:600}
.full{grid-column:1/-1}
canvas{display:block;width:100%;height:auto;border-radius:6px}
#timeline{width:100%}
.tiles{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.tile{background:var(--page);border:1px solid var(--border);border-radius:6px;
  padding:6px 10px;min-width:96px}
.tile .k{font-size:11px;color:var(--muted)}
.tile .v{font-size:19px;font-variant-numeric:tabular-nums}
.tile .u{font-size:11px;color:var(--muted);margin-left:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:12px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-top:6px;
  flex-wrap:wrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
dialog{border:1px solid var(--border);border-radius:10px;background:var(--surface);
  color:var(--ink);max-width:min(760px,92vw);width:100%}
dialog::backdrop{background:rgba(0,0,0,.45)}
.list{max-height:50vh;overflow:auto;border:1px solid var(--border);
  border-radius:6px;margin:8px 0}
.list div{padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;gap:10px}
.list div:hover{background:var(--page)}
.badge{font-size:11px;color:#fff;background:var(--s3);border-radius:10px;
  padding:1px 7px}
#status{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>LEO データビューア</h1>
  <button id="pick" class="primary">データを選択…</button>
  <span id="srcName" class="muted">未選択</span>
  <span style="flex:1"></span>
  <label class="muted">粒度
    <select id="step">
      <option value="1">1秒</option><option value="5">5秒</option>
      <option value="10" selected>10秒</option><option value="30">30秒</option>
      <option value="60">1分</option><option value="300">5分</option>
    </select>
  </label>
  <label class="muted">再生速度
    <select id="speed">
      <option value="1">×1</option><option value="5" selected>×5</option>
      <option value="20">×20</option><option value="60">×60</option>
    </select>
  </label>
  <button id="play" disabled>▶ 再生</button>
</header>

<div style="padding:0 16px 6px">
  <input id="timeline" type="range" min="0" max="0" value="0" disabled>
  <div class="row">
    <strong id="clock">—</strong>
    <span id="status" style="flex:1"></span>
  </div>
</div>

<main>
  <section class="card full">
    <div class="tiles" id="tiles"></div>
    <canvas id="strip" height="150"></canvas>
    <div class="legend">
      <span><span class="sw" style="background:var(--s1)"></span>下り Mbps</span>
      <span><span class="sw" style="background:var(--s2)"></span>上り Mbps</span>
      <span><span class="sw" style="background:var(--s3)"></span>RTT ms</span>
      <span><span class="sw" style="background:var(--s4)"></span>SINR dB</span>
      <span class="muted">縦線=再生位置。クリックでその時刻へ移動</span>
    </div>
  </section>

  <section class="card">
    <h2>上空の衛星とアンテナ指向(スカイビュー)</h2>
    <canvas id="sky" height="440"></canvas>
    <div class="legend">
      <span><span class="sw" style="background:var(--s1)"></span>Starlink</span>
      <span><span class="sw" style="background:var(--s2)"></span>OneWeb</span>
      <span><span class="sw" style="background:var(--crit)"></span>アンテナ指向</span>
      <span class="muted">中心=天頂 / 外周=地平線</span>
    </div>
    <div class="row" style="margin-top:6px">
      <label class="muted">最低仰角
        <select id="minEl">
          <option value="0">0°</option><option value="10" selected>10°</option>
          <option value="25">25°</option><option value="40">40°</option>
        </select>
      </label>
      <span id="satInfo" class="muted"></span>
    </div>
  </section>

  <section class="card">
    <h2>雨雲とアンテナ位置</h2>
    <canvas id="map" height="440"></canvas>
    <div class="row" style="margin-top:6px">
      <span id="posInfo" class="muted"></span>
      <span style="flex:1"></span>
      <button id="setPos">地図上で位置を指定</button>
      <button id="zoomIn">＋</button><button id="zoomOut">−</button>
    </div>
    <div class="legend">
      <span class="muted">降水量 mm/h:</span>
      <span><span class="sw" style="background:#cde2fb"></span>0.1</span>
      <span><span class="sw" style="background:#6da7ec"></span>1</span>
      <span><span class="sw" style="background:#2a78d6"></span>5</span>
      <span><span class="sw" style="background:#184f95"></span>10</span>
      <span><span class="sw" style="background:#eb6834"></span>30+</span>
      <span id="rainInfo" class="muted"></span>
    </div>
  </section>
</main>

<dialog id="browser">
  <div style="padding:14px">
    <div class="row">
      <strong>データの場所を選択</strong><span style="flex:1"></span>
      <button id="closeBrowser">閉じる</button>
    </div>
    <div class="row" style="margin-top:8px">
      <input id="pathInput" style="flex:1" placeholder="フォルダのパスを直接入力">
      <button id="goPath">移動</button>
      <button id="useThis" class="primary">このフォルダを読み込む</button>
    </div>
    <div class="list" id="list"></div>
    <div class="muted">フォルダを選ぶとその中のCSVをまとめて読み込みます。
      <span class="badge">計測データ</span> はCSVを含むフォルダです。</div>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const state = {
  run: null, idx: 0, playing: false, timer: null,
  home: null, homeManual: null, zoom: 8, sats: {}, rain: null,
  satAt: null, rainAt: null, pickMode: false,
};

// ---------- data loading ----------
async function api(path, params) {
  const q = new URLSearchParams(params || {}).toString();
  const r = await fetch(path + (q ? "?" + q : ""));
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

async function loadRun(path) {
  setStatus("読み込み中…");
  try {
    const run = await api("/api/load", { path, step: $("#step").value });
    state.run = run;
    state.idx = 0;
    state.home = run.home;
    $("#srcName").textContent = run.label + "(" + run.times.length + " サンプル)";
    $("#timeline").max = Math.max(0, run.times.length - 1);
    $("#timeline").value = 0;
    $("#timeline").disabled = false;
    $("#play").disabled = false;
    state.zoom = autoZoom(run);
    state.sats = {}; state.rain = null; state.satAt = null; state.rainAt = null;
    const src = run.sources.map(s => s.file).join(", ");
    setStatus("読み込み完了: " + src +
      (run.meta.tool_version ? " / " + run.meta.tool_version : ""));
    render(true);
  } catch (e) { setStatus("エラー: " + e.message); }
}

function setStatus(t) { $("#status").textContent = t; }

// 走行範囲がちょうど収まるズーム(静止なら市街地スケール)
function autoZoom(run) {
  const la = (run.series.lat || []).filter(v => v != null);
  const lo = (run.series.lon || []).filter(v => v != null);
  if (la.length < 2) return 12;
  // 軌跡が地図幅(約600px)に収まる最大ズームを選ぶ
  const spanLat = Math.max(...la) - Math.min(...la);
  const spanLon = Math.max(...lo) - Math.min(...lo);
  const span = Math.max(spanLat * 1.4, spanLon, 0.0015);  // 緯度は縦に効く
  const z = Math.log2(600 / 256 * 360 / span);
  return Math.max(3, Math.min(15, Math.floor(z)));
}

// ---------- browser dialog ----------
async function browse(path) {
  const j = await api("/api/browse", { path });
  $("#pathInput").value = j.path;
  const list = $("#list"); list.innerHTML = "";
  if (j.parent) list.appendChild(entry("../ (上へ)", j.parent, true, false));
  j.entries.forEach(e => list.appendChild(
    entry((e.dir ? "📁 " : "📄 ") + e.name, e.path, e.dir, e.run)));
}
function entry(label, path, isDir, isRun) {
  const d = document.createElement("div");
  d.innerHTML = "<span>" + label + "</span>" +
    (isRun ? '<span class="badge">計測データ</span>' : "");
  d.onclick = () => { isDir ? browse(path) : (closeDlg(), loadRun(path)); };
  return d;
}
function closeDlg() { $("#browser").close(); }
$("#pick").onclick = () => { $("#browser").showModal(); browse($("#pathInput").value || "."); };
$("#closeBrowser").onclick = closeDlg;
$("#goPath").onclick = () => browse($("#pathInput").value);
$("#useThis").onclick = () => { const p = $("#pathInput").value; closeDlg(); loadRun(p); };
$("#step").onchange = () => { if (state.run) loadRun(state.run.path); };

// ---------- playback ----------
$("#play").onclick = () => setPlaying(!state.playing);
function setPlaying(on) {
  state.playing = on;
  $("#play").textContent = on ? "❚❚ 一時停止" : "▶ 再生";
  clearInterval(state.timer);
  if (on) state.timer = setInterval(tick, 1000 / Math.min(10, +$("#speed").value));
}
$("#speed").onchange = () => { if (state.playing) setPlaying(true); };
function tick() {
  if (!state.run) return;
  const stepFrames = Math.max(1, Math.round(+$("#speed").value /
    Math.min(10, +$("#speed").value)));
  state.idx += stepFrames;
  if (state.idx >= state.run.times.length) { state.idx = 0; }
  $("#timeline").value = state.idx;
  render();
}
$("#timeline").oninput = e => { state.idx = +e.target.value; render(); };

// ---------- rendering ----------
function fmtClock(epoch) {
  const d = new Date(epoch * 1000);
  const jst = new Date(d.getTime() + 9 * 3600 * 1000);
  return jst.toISOString().replace("T", " ").slice(0, 19) + " JST";
}
function cur(key) {
  const s = state.run.series[key];
  return s ? s[state.idx] : null;
}
function nearest(key, i) {
  const s = state.run.series[key]; if (!s) return null;
  for (let d = 0; d < 60; d++) {
    if (s[i - d] != null) return s[i - d];
    if (s[i + d] != null) return s[i + d];
  }
  return null;
}

function render(initial) {
  if (!state.run) return;
  const t = state.run.times[state.idx];
  $("#clock").textContent = fmtClock(t);
  drawTiles();
  drawStrip();
  updateHome();
  drawSky();
  drawMap();
  maybeFetchSats(t);
  maybeFetchRain(t);
}

function drawTiles() {
  const defs = [
    ["下り", cur("down_mbps"), "Mbps"], ["上り", cur("up_mbps"), "Mbps"],
    ["RTT", cur("rtt_ms"), "ms"], ["SINR", cur("snr_db"), "dB"],
    ["速度", cur("speed"), "m/s"],
  ];
  $("#tiles").innerHTML = defs.filter(d => d[1] != null).map(d =>
    `<div class="tile"><div class="k">${d[0]}</div><div class="v">${
      (+d[1]).toFixed(d[2] === "Mbps" ? 1 : 2)}<span class="u">${d[2]}</span></div></div>`
  ).join("") || '<span class="muted">この時刻のデータはありません</span>';
}

function fitCanvas(c, h) {
  const w = c.clientWidth || 600;
  if (c.width !== w * devicePixelRatio || c.height !== h * devicePixelRatio) {
    c.width = w * devicePixelRatio; c.height = h * devicePixelRatio;
  }
  const g = c.getContext("2d");
  g.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  g.clearRect(0, 0, w, h);
  return [g, w, h];
}
const css = v => getComputedStyle(document.body).getPropertyValue(v).trim();

function drawStrip() {
  const [g, w, h] = fitCanvas($("#strip"), 150);
  const n = state.run.times.length; if (!n) return;
  const pad = { l: 40, r: 8, t: 8, b: 16 };
  const plot = { w: w - pad.l - pad.r, h: h - pad.t - pad.b };
  const chans = [["down_mbps", "--s1"], ["up_mbps", "--s2"],
                 ["rtt_ms", "--s3"], ["snr_db", "--s4"]];
  g.strokeStyle = css("--grid"); g.beginPath();
  g.moveTo(pad.l, pad.t + plot.h); g.lineTo(w - pad.r, pad.t + plot.h); g.stroke();
  chans.forEach(([key, col]) => {
    const s = state.run.series[key]; if (!s || !s.some(v => v != null)) return;
    const vals = s.filter(v => v != null);
    const max = Math.max(...vals) || 1;
    g.strokeStyle = css(col); g.lineWidth = 1.5; g.beginPath();
    let pen = false;
    s.forEach((v, i) => {
      if (v == null) { pen = false; return; }
      const x = pad.l + plot.w * (i / Math.max(1, n - 1));
      const y = pad.t + plot.h * (1 - v / max);
      pen ? g.lineTo(x, y) : g.moveTo(x, y); pen = true;
    });
    g.stroke();
  });
  const x = pad.l + plot.w * (state.idx / Math.max(1, n - 1));
  g.strokeStyle = css("--crit"); g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(x, pad.t); g.lineTo(x, pad.t + plot.h); g.stroke();
  g.fillStyle = css("--muted"); g.font = "11px system-ui";
  g.fillText(fmtClock(state.run.times[0]).slice(5, 16), pad.l, h - 4);
  g.textAlign = "right";
  g.fillText(fmtClock(state.run.times[n - 1]).slice(5, 16), w - pad.r, h - 4);
  g.textAlign = "left";
}
$("#strip").onclick = e => {
  if (!state.run) return;
  const r = e.target.getBoundingClientRect();
  const frac = (e.clientX - r.left - 40) / (r.width - 48);
  state.idx = Math.max(0, Math.min(state.run.times.length - 1,
    Math.round(frac * (state.run.times.length - 1))));
  $("#timeline").value = state.idx; render();
};

// ---------- sky view ----------
function drawSky() {
  const [g, w, h] = fitCanvas($("#sky"), 440);
  const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 24;
  g.strokeStyle = css("--grid");
  [0, 30, 60].forEach(el => {
    g.beginPath(); g.arc(cx, cy, R * (1 - el / 90), 0, 7); g.stroke();
  });
  g.fillStyle = css("--muted"); g.font = "11px system-ui"; g.textAlign = "center";
  [["N", 0], ["E", 90], ["S", 180], ["W", 270]].forEach(([lbl, az]) => {
    const a = (az - 90) * Math.PI / 180;
    g.fillText(lbl, cx + (R + 12) * Math.cos(a), cy + (R + 12) * Math.sin(a) + 4);
  });
  g.fillText("30°", cx, cy - R * (1 - 30 / 90) - 3);

  const project = (az, el) => {
    const r = R * (1 - Math.max(0, Math.min(90, el)) / 90);
    const a = (az - 90) * Math.PI / 180;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  };
  // 直近の指向履歴(ハンドオーバーで不連続に跳ぶのが見える)
  const S = state.run.series;
  ["kymeta", "starlink"].forEach(src => {
    if (!S[src + "_az"]) return;
    g.strokeStyle = css("--crit"); g.globalAlpha = .25; g.lineWidth = 1.5;
    g.beginPath(); let pen = false;
    for (let i = Math.max(0, state.idx - 60); i <= state.idx; i++) {
      const a = S[src + "_az"][i], e = S[src + "_el"][i];
      if (a == null || e == null) { pen = false; continue; }
      const r = R * (1 - Math.max(0, Math.min(90, e)) / 90);
      const ang = (a - 90) * Math.PI / 180;
      const x = cx + r * Math.cos(ang), y = cy + r * Math.sin(ang);
      pen ? g.lineTo(x, y) : g.moveTo(x, y); pen = true;
    }
    g.stroke(); g.globalAlpha = 1;
  });

  const colors = { starlink: css("--s1"), oneweb: css("--s2") };
  Object.entries(state.sats).forEach(([group, list]) => {
    g.fillStyle = colors[group] || css("--s3");
    (list || []).forEach(s => {
      const [x, y] = project(s.az, s.el);
      g.beginPath(); g.arc(x, y, 3.2, 0, 7); g.fill();
    });
  });
  // antenna pointing
  [["kymeta", "Kymeta"], ["starlink", "Starlink"]].forEach(([src, label]) => {
    const az = nearest(src + "_az", state.idx), el = nearest(src + "_el", state.idx);
    if (az == null || el == null) return;
    // どの衛星を掴んでいそうか: 指向に最も近い1機を線で結ぶ
    const target = nearestSat(az, el);
    if (target) {
      const [tx, ty] = project(target.sat.az, target.sat.el);
      g.strokeStyle = css("--s3"); g.lineWidth = 2; g.globalAlpha = .9;
      g.beginPath(); g.arc(tx, ty, 7, 0, 7); g.stroke(); g.globalAlpha = 1;
      g.fillStyle = css("--s3"); g.textAlign = "left"; g.font = "11px system-ui";
      g.fillText(`${target.sat.name} (${target.sep.toFixed(1)}°)`, tx + 10, ty - 8);
    }
    const [x, y] = project(az, el);
    g.strokeStyle = css("--crit"); g.lineWidth = 2;
    g.beginPath(); g.arc(x, y, 9, 0, 7); g.stroke();
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(x, y);
    g.setLineDash([4, 4]); g.globalAlpha = .6; g.stroke();
    g.setLineDash([]); g.globalAlpha = 1;
    g.fillStyle = css("--crit"); g.textAlign = "left";
    g.fillText(`${label} ${az.toFixed(0)}°/${el.toFixed(0)}°`, x + 12, y + 4);
  });
}

// 角距離が最小の衛星(= 指向先の候補)
function nearestSat(az, el) {
  let best = null;
  const toXYZ = (a, e) => {
    const ar = a * Math.PI / 180, er = e * Math.PI / 180;
    return [Math.cos(er) * Math.cos(ar), Math.cos(er) * Math.sin(ar), Math.sin(er)];
  };
  const p = toXYZ(az, el);
  Object.values(state.sats).forEach(list => (list || []).forEach(s => {
    const q = toXYZ(s.az, s.el);
    const dot = Math.min(1, Math.max(-1, p[0]*q[0] + p[1]*q[1] + p[2]*q[2]));
    const sep = Math.acos(dot) * 180 / Math.PI;
    if (!best || sep < best.sep) best = { sat: s, sep };
  }));
  return best && best.sep < 25 ? best : null;
}

async function maybeFetchSats(t) {
  const home = activeHome(); if (!home) { $("#satInfo").textContent =
    "アンテナ位置が未設定のため衛星を表示できません"; return; }
  const bucket = Math.round(t / 10) * 10;
  if (state.satAt === bucket) return;
  state.satAt = bucket;
  try {
    const j = await api("/api/sats", {
      lat: home.lat, lon: home.lon, t: bucket, min_el: $("#minEl").value,
    });
    state.sats = j.sats;
    const parts = Object.entries(j.info).map(([g, i]) =>
      i.error ? `${g}: ${i.error}` :
        `${g} ${(j.sats[g] || []).length}機(TLE ${i.tle_age_days}日前)`);
    $("#satInfo").textContent = parts.join(" / ");
    drawSky();
  } catch (e) { $("#satInfo").textContent = "衛星: " + e.message; }
}
$("#minEl").onchange = () => { state.satAt = null; render(); };

// ---------- map ----------
function activeHome() {
  return state.homeManual || (state.home && { lat: state.home.lat, lon: state.home.lon });
}
function updateHome() {
  const h = activeHome();
  const live = (cur("lat") != null && cur("lon") != null)
    ? { lat: cur("lat"), lon: cur("lon") } : null;
  if (live) state.liveHome = live;
  $("#posInfo").textContent = h
    ? `位置: ${(live || h).lat.toFixed(5)}, ${(live || h).lon.toFixed(5)}` +
      (state.homeManual ? "(手動指定)" :
        state.home && state.home.moving ? "(移動あり)" : "(データより)")
    : "アンテナ位置が不明です。「地図上で位置を指定」を押してください";
}
function lonToX(lon, z) { return (lon + 180) / 360 * Math.pow(2, z); }
function latToY(lat, z) {
  const r = lat * Math.PI / 180;
  return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * Math.pow(2, z);
}
function xToLon(x, z) { return x / Math.pow(2, z) * 360 - 180; }
function yToLat(y, z) {
  const n = Math.PI - 2 * Math.PI * y / Math.pow(2, z);
  return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
}

function drawMap() {
  const [g, w, h] = fitCanvas($("#map"), 440);
  const home = state.liveHome || activeHome();
  g.fillStyle = css("--page"); g.fillRect(0, 0, w, h);
  if (!home) {
    g.fillStyle = css("--muted"); g.textAlign = "center";
    g.fillText("アンテナ位置が不明です(下のボタンで指定できます)", w / 2, h / 2);
    return;
  }
  const z = state.zoom, TS = 256;
  const cx = lonToX(home.lon, z) * TS, cy = latToY(home.lat, z) * TS;
  const x0 = cx - w / 2, y0 = cy - h / 2;
  for (let tx = Math.floor(x0 / TS); tx <= Math.floor((x0 + w) / TS); tx++) {
    for (let ty = Math.floor(y0 / TS); ty <= Math.floor((y0 + h) / TS); ty++) {
      const img = tile(z, tx, ty);
      if (img && img.complete && img.naturalWidth)
        g.drawImage(img, tx * TS - x0, ty * TS - y0, TS, TS);
    }
  }
  // rain overlay
  if (state.rain && state.rain.available) {
    const { lats, lons, grid, n } = state.rain;
    const dLat = Math.abs(lats[1] - lats[0]), dLon = Math.abs(lons[1] - lons[0]);
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const v = grid[i * n + j]; if (v == null || v < 0.05) continue;
      const px = lonToX(lons[j] - dLon / 2, z) * TS - x0;
      const py = latToY(lats[i] + dLat / 2, z) * TS - y0;
      const pw = (lonToX(lons[j] + dLon / 2, z) * TS - x0) - px;
      const ph = (latToY(lats[i] - dLat / 2, z) * TS - y0) - py;
      g.fillStyle = rainColor(v); g.globalAlpha = .55;
      g.fillRect(px, py, pw, ph); g.globalAlpha = 1;
    }
  }
  // track + marker
  const S = state.run && state.run.series;
  if (S && S.lat) {
    g.strokeStyle = css("--s3"); g.lineWidth = 2; g.beginPath();
    let pen = false;
    for (let i = 0; i < S.lat.length; i++) {
      if (S.lat[i] == null) { pen = false; continue; }
      const px = lonToX(S.lon[i], z) * TS - x0, py = latToY(S.lat[i], z) * TS - y0;
      pen ? g.lineTo(px, py) : g.moveTo(px, py); pen = true;
    }
    g.stroke();
  }
  const mx = lonToX(home.lon, z) * TS - x0, my = latToY(home.lat, z) * TS - y0;
  g.fillStyle = css("--crit"); g.beginPath(); g.arc(mx, my, 6, 0, 7); g.fill();
  g.strokeStyle = "#fff"; g.lineWidth = 2; g.stroke();
  // pointing arrow (azimuth) from the antenna
  const az = nearest("kymeta_az", state.idx) ?? nearest("starlink_az", state.idx);
  if (az != null) {
    const a = (az - 90) * Math.PI / 180, L = 46;
    g.strokeStyle = css("--crit"); g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(mx, my);
    g.lineTo(mx + L * Math.cos(a), my + L * Math.sin(a)); g.stroke();
  }
  g.fillStyle = css("--muted"); g.font = "10px system-ui"; g.textAlign = "right";
  g.fillText("© OpenStreetMap contributors", w - 6, h - 6); g.textAlign = "left";
}
const _tiles = {};
function tile(z, x, y) {
  const max = Math.pow(2, z);
  if (y < 0 || y >= max) return null;
  const key = `${z}/${((x % max) + max) % max}/${y}`;
  if (!_tiles[key]) {
    const img = new Image();
    img.onload = () => drawMap();
    img.src = "/api/tile?z=" + z + "&x=" + (((x % max) + max) % max) + "&y=" + y;
    _tiles[key] = img;
  }
  return _tiles[key];
}
function rainColor(v) {
  if (v >= 30) return "#eb6834";
  if (v >= 10) return "#184f95";
  if (v >= 5) return "#2a78d6";
  if (v >= 1) return "#6da7ec";
  return "#cde2fb";
}
$("#zoomIn").onclick = () => { state.zoom = Math.min(14, state.zoom + 1); drawMap(); };
$("#zoomOut").onclick = () => { state.zoom = Math.max(3, state.zoom - 1); drawMap(); };
$("#setPos").onclick = () => {
  state.pickMode = true;
  setStatus("地図をクリックしてアンテナ位置を指定してください");
};
$("#map").onclick = e => {
  if (!state.pickMode) return;
  const c = $("#map"), r = c.getBoundingClientRect();
  const home = state.liveHome || activeHome() || { lat: 35.68, lon: 139.76 };
  const z = state.zoom, TS = 256, w = r.width, h = r.height;
  const x0 = lonToX(home.lon, z) * TS - w / 2, y0 = latToY(home.lat, z) * TS - h / 2;
  state.homeManual = {
    lat: yToLat((y0 + (e.clientY - r.top)) / TS, z),
    lon: xToLon((x0 + (e.clientX - r.left)) / TS, z),
  };
  state.pickMode = false; state.satAt = null; state.rainAt = null;
  setStatus("アンテナ位置を手動設定しました");
  render();
};

// ---------- rain ----------
async function maybeFetchRain(t) {
  const home = activeHome(); if (!home) return;
  const bucket = Math.floor(t / 3600) * 3600;
  if (state.rainAt === bucket) return;
  state.rainAt = bucket;
  try {
    const j = await api("/api/rain", { lat: home.lat, lon: home.lon, t: bucket });
    state.rain = j;
    $("#rainInfo").textContent = j.available
      ? `${j.hour_utc}Z の降水 / ${j.source}`
      : "この時刻の降水データは取得できませんでした";
    drawMap();
  } catch (e) { $("#rainInfo").textContent = "降水: " + e.message; }
}

// ---------- boot ----------
window.addEventListener("resize", () => { if (state.run) render(); });
const initial = new URLSearchParams(location.search).get("path");
if (initial) { $("#pathInput").value = initial; loadRun(initial); }
else { $("#pathInput").value = ""; setStatus("「データを選択…」からCSVのフォルダを選んでください"); }
</script>
</body>
</html>
